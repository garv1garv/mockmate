version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mockmate-net

  ml_service:
    build: 
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"za
    environment:
      - AI_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    networks:
      - mockmate-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/mockmate
      - ML_SERVICE_URL=http://ml_service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ml_service
    networks:
      - mockmate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - mockmate-net

networks:
  mockmate-net:
    driver: bridge

volumes:
  mongodb_data:
